[project]
name = "workshop-rl2-implementation"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tensorboard>=2.13.0",
    "torch>=2.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
