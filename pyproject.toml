[project]
name = "workshop-rl2-implementation"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "stable-baselines3[extra]>=2.0.0",  # includes gymnasium, numpy, pandas, matplotlib, torch, tqdm, rich
    "tensorboard>=2.13.0",       # for training logs (optional for sb3)
    "jupyterlab>=4.0.0",         # for notebooks
    "ipywidgets>=8.0.0",         # for notebook widgets
    "pytest>=7.0.0",             # for testing
    "scipy>=1.11.0",             # for LP/MPC baselines
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
